id: software-development
name: Software development
version: "1"
metadata: {}
steps:
  - id: spec
    name: Write specification
    type: AGENT
    stage: SPEC
    agentType: spec
    requiresApproval: true
    approval:
      mode: ai
      maxRevisions: 4
    configuration: {}
    produces:
      - SPEC

  - id: plan
    name: Write plan
    type: AGENT
    stage: PLAN
    agentType: plan
    requiresApproval: true
    approval:
      mode: ai
      maxRevisions: 4
    configuration: {}
    consumes:
      - SPEC
    produces:
      - PLAN

  - id: task
    name: Break down tasks
    type: AGENT
    stage: TASK
    agentType: task
    requiresApproval: true
    approval:
      mode: ai
      maxRevisions: 4
    configuration: {}
    consumes:
      - SPEC
      - PLAN
    produces:
      - TASK

  - id: implement
    name: Implement
    type: AGENT
    stage: IMPLEMENTING
    agentType: implement
    requiresApproval: false
    configuration: {}
    consumes:
      - SPEC
      - PLAN
      - TASK
    produces:
      - CODE

  - id: review
    name: Review code
    type: AGENT
    stage: CODE_REVIEW
    agentType: review
    requiresApproval: false
    configuration: {}
    consumes:
      - SPEC
      - PLAN
      - TASK
      - CODE
    produces:
      - CODE_REVIEW

  - id: test
    name: Run tests
    type: AGENT
    stage: TESTING
    agentType: test
    requiresApproval: false
    configuration: {}
    consumes:
      - TASK
      - CODE
    produces:
      - TEST_REPORT

  - id: ci
    name: Run pipeline
    type: INTEGRATION
    stage: CI
    action: run-pipeline
    requiresApproval: false
    # Poll while the provider's pipeline is running (hosting actions
    # report PIPELINE_RUNNING as a retryable failure).
    retryPolicy:
      maxAttempts: 120
      backoffSeconds: 30
      retryOn: [PIPELINE_RUNNING]
    configuration: {}
    consumes:
      - CODE

  - id: merge
    name: Await merge
    type: SYSTEM
    stage: READY_TO_MERGE
    action: await-merge
    requiresApproval: false
    # Poll while the change request is open (hosting actions report
    # MERGE_PENDING as a retryable failure).
    retryPolicy:
      maxAttempts: 120
      backoffSeconds: 60
      retryOn: [MERGE_PENDING]
    configuration: {}
    consumes:
      - CODE_REVIEW
      - TEST_REPORT
