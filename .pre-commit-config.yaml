# Pre-commit hooks for this repository.
# Install once per clone:  pip install pre-commit && pre-commit install
# The hook set is intentionally minimal: secrets scanning only.
# The same scan runs in CI (see .github/workflows/ci.yml), so a clone
# without the hooks installed is still covered.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
