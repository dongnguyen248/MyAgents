name: CI

on:
  push:
  pull_request:

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary is pinned and checksum-verified instead of
      # using the third-party action: no extra action dependency, and
      # the version matches .pre-commit-config.yaml exactly.
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSLO "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSLO "${base}/gitleaks_${version}_checksums.txt"
          grep "gitleaks_${version}_linux_x64.tar.gz" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
      - name: Scan the git history
        run: ./gitleaks git --redact .

  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        # The suite imports the API stack (fastapi/httpx) and the
        # MariaDB driver at module level, so CI needs every extra —
        # with only [dev] collection fails on a clean machine even
        # though developer venvs (which have all extras) pass.
        run: pip install -e ".[dev,api,mariadb]"
      - name: Ruff lint
        run: ruff check src tests harness
      - name: Ruff format
        run: ruff format --check src tests harness
      - name: Mypy
        run: mypy src
      - name: Bandit
        # The config file is passed explicitly: bandit's automatic
        # discovery is unreliable across versions, and .bandit
        # documents every by-design skip.
        run: bandit -c .bandit -r src -q
      - name: Tests with coverage
        run: pytest -q --cov=asf --cov-report=term-missing
      - name: Code structure ratchet
        run: python scripts/check_code_structure.py --baseline .code-structure-baseline.json

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      # The build script runs `tsc --noEmit` first, so type-checking
      # is covered; there is no separate lint script in this app.
      - name: Build (type-check + bundle)
        run: npm run build
      - name: Dashboard unit tests
        working-directory: apps/dashboard
        run: npm test
      - name: Dashboard lint
        working-directory: apps/dashboard
        run: npm run lint
      - name: Dashboard format check
        working-directory: apps/dashboard
        run: npm run format:check
