id: vhpc
name: VHPC

repository:
  provider: gitlab
  # url / credentials are NOT stored here; use secret references

technology:
  backend: [java, spring]
  frontend: [react]

workflow: software-development

enabledSkills: [java, spring, react, git, testing, security]

configuration:
  approval:
    channel: teams
  # The Review Agent reviews this project's code against these standards
  # (Markdown files relative to this projects directory).
  review:
    rulesFiles:
      - rules/vhpc/coding-rules.md
      - rules/vhpc/api-rules.md
      - rules/vhpc/security-rules.md
      - rules/vhpc/typescript-coding-rules.md
      - rules/vhpc/constants-rules.md
