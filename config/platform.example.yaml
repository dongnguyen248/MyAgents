# Example platform configuration for AI Software Agents
# Copy this file to platform.yaml (or platform.local.yaml for local overrides).

version: 1
logLevel: INFO

# Concurrency bounds: how many runs may be driven at once, and how
# many model calls may be in flight at once (protects provider quotas
# from a burst of parallel runs).
# Review/test/fix loop: how many fix attempts each task item gets
# before the run escalates to an operator (raise it, restart, then
# resume the escalated run to grant a fresh budget).
codeLoop:
  maxFixes: 3

execution:
  maxConcurrentRuns: 2
  maxConcurrentModelCalls: 2
  # A step running longer than this (or a run untouched for over a
  # minute with nobody driving it) is shown to operators as STALLED.
  watchdog:
    stallSeconds: 900

# Per-run model budget (all dimensions optional; omit or leave a
# dimension out for no limit). The orchestrator checks the run's
# accumulated usage before every dispatch and fails the run with
# RUN_BUDGET_EXCEEDED instead of calling the model again.
# budget:
#   maxPromptTokens: 500000
#   maxCompletionTokens: 100000
#   maxModelCalls: 40

# Filesystem paths
paths:
  artifactsDir: artifacts

# Language model gateway configuration
models:
  default: fast
  profiles:
    fast:
      provider: example-provider
      model: example-fast-v1
      endpoint: https://api.example.com/v1
      credentials:
        env: EXAMPLE_MODEL_API_KEY
      timeoutSeconds: 45
      parameters:
        temperature: 0.7

# External source control adapter configuration
sourceControl:
  provider: example-provider
  endpoint: https://git.example.com
  credentials:
    env: EXAMPLE_SCM_TOKEN
  settings:
    defaultBranch: main

# Continuous integration service configuration
ci:
  provider: example-provider
  endpoint: https://ci.example.com
  credentials:
    env: EXAMPLE_CI_TOKEN
  settings:
    timeoutMinutes: 30

# Notification channels for alerts and human approval requests
# For Teams Workflows approvals (no custom bot), replace this example locally using:
# ../src/asf/integrations/teams/README.md (workflow URL and callback secret via env references).
notifications:
  - name: engineering-team
    type: example-provider
    endpoint: https://chat.example.com/webhook
    credentials:
      env: EXAMPLE_CHAT_WEBHOOK_KEY
    settings:
      channelName: dev-approvals

# Per-agent settings and model profile overrides
agents:
  spec:
    modelProfile: fast
    timeoutSeconds: 300
    retryPolicy:
      maxAttempts: 2
      backoffSeconds: 1.5
      retryOn:
        - LLM_TIMEOUT
        - LLM_RATE_LIMITED
    settings:
      strictMode: true
  # Code-generating agents: editFormat selects the model's output
  # format — "blocks" (SEARCH/REPLACE edit blocks, the default:
  # far fewer output tokens for small changes) or "json" (the
  # legacy full-file ChangeSet envelope). repairAttempts (0 or 1,
  # default 1) lets the agent continue the same conversation once
  # with the specific rejection reason when a reply fails to parse
  # or validate. repoMapMaxChars bounds the repository map (tree +
  # neighbour outlines) added to the prompt; 0 disables it.
  # reportTailLines bounds how much of a test report's command
  # output is fed back into fix/review prompts (the artifact keeps
  # the full output).
  implement:
    settings:
      editFormat: blocks
      repairAttempts: 1
      repoMapMaxChars: 6000
  fix:
    settings:
      editFormat: blocks
      repairAttempts: 1
      repoMapMaxChars: 6000
      reportTailLines: 120
  # review.skipWhenTestsPass (default false): when a TEST_REPORT
  # with verdict PASS exists for the exact code version under
  # review and the change is at most maxDiffLines content lines,
  # the review is recorded as APPROVE without an LLM call.
  review:
    settings:
      reportTailLines: 120
      skipWhenTestsPass: false
      maxDiffLines: 200
  # test.failFast (default true): stop at the first failing test
  # command; the rest are recorded as skipped in the report.
  test:
    settings:
      failFast: true
