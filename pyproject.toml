[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-factory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "jsonschema[format]>=4.18,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
asf = ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.json", "**/*.txt"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
