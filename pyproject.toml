[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-agents"
version = "0.1.0"
description = "AI Software Agents (ASF): a project-independent platform that runs an AI software development team — spec, plan, task, implement, review, test, fix agents coordinated by an orchestrator with human approval gates."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dongnguyen" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "jsonschema[format]>=4.18,<5",
]

[project.optional-dependencies]
mariadb = [
    "pymysql>=1.1",
]
# The HTTP API + dashboard backend (FastAPI app and the demo server).
# Renamed from the historical `teams` extra: it serves the whole API,
# not just the Teams approval integration.
api = [
    "fastapi>=0.115.13,<1",
    "uvicorn>=0.34.3,<1",
    "httpx>=0.28.1,<1",
]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261103",
    "bandit==1.9.4",
]

[project.scripts]
asf = "asf.cli:main"  # asf.cli is a package; main lives in its __init__

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
asf = ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.json", "**/*.txt"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "S", "ASYNC",
    # Phase 11a code-structure enforcement (Appendix A): complexity,
    # size and shape rules Ruff can own. Function code-lines are
    # owned by scripts/check_code_structure.py (Ruff has no such
    # rule); PLR0915 max-statements is the closest proxy there.
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "ERA001", "E701", "E702", "E703",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 25

[tool.ruff.lint.per-file-ignores]
# Phase 11a ratchet: the C901/PLR structure rules are enforced
# everywhere except the trees the refactor waves have not reached
# yet. Each block names the wave that deletes it; a block may only
# shrink, never grow (same rule as .code-structure-baseline.json).
# Wave 2 (api + orchestrator).
"src/asf/api/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]
"src/asf/orchestrator/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
# Wave 3 (everything else under src + harness).
"src/asf/approval/**" = ["C901", "PLR0912", "PLR0915"]
"src/asf/configuration/**" = ["PLR0915", "PLR2004"]
"src/asf/evaluation/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR2004"]
"src/asf/integrations/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]
"src/asf/state_machine/**" = ["PLR0915"]
"src/asf/tools/**" = ["C901", "PLR0912", "PLR0915", "PLR2004"]
"src/asf/workflow/**" = ["C901", "PLR0915"]

# Tests and the evaluation harness use asserts and fixture
# credentials by design; the security rule family does not apply.
"tests/**" = ["S", "C901", "ERA001", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]
"harness/**" = ["S", "PLR0915", "PLR2004"]
# FastAPI's Depends/Body-in-defaults is the framework idiom.
"src/asf/api/app.py" = ["B008"]
# Remaining swallowed errors in the service are best-effort cleanup
# or at-least-once delivery paths (mirrors the .bandit review).
"src/asf/api/service/queries.py" = ["S110"]
"src/asf/api/service/commands.py" = ["S110"]
"src/asf/api/service/driver.py" = ["S112"]
"src/asf/api/demo.py" = ["S112"]
# The repo map skips files it cannot read, by design.
"src/asf/agents/_shared/repomap.py" = ["S112"]
# str+Enum is kept for FindingSeverity: migrating to StrEnum
# changes str() output and is a deliberate future change.
"src/asf/agents/_shared/contracts.py" = ["UP042"]
# UniqueKeyLoader subclasses SafeLoader; S506 is a false positive.
"src/asf/configuration/yamlio.py" = ["S506"]
# Store SQL is parameterized; only fixed internal identifiers are
# interpolated (mirrors the .bandit review).
"src/asf/storage/mariadb.py" = ["S608"]
# urllib transports open configured provider base URLs (http/https)
# only (mirrors the .bandit review).
"src/asf/integrations/gemini.py" = ["S310"]
"src/asf/integrations/openai_compatible.py" = ["S310"]
"src/asf/integrations/hosting/http.py" = ["S310"]
# Spawning the project's own configured commands with shell=False
# and a validated argv is the sandbox's purpose.
"src/asf/tools/local.py" = ["S603"]
"src/asf/tools/worktree.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
plugins = ["pydantic.mypy"]

# Strict mode is enabled package by package as modules qualify;
# the pure core goes first. The flags are spelled out because a
# bare `strict = true` in a per-module override is not scoped by
# mypy (it leaks globally); these are the strict flags mypy
# accepts per module.
[[tool.mypy.overrides]]
module = ["asf.orchestrator.*", "asf.state_machine.*", "asf.approval.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
